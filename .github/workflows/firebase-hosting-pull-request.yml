# This workflow automatically builds and deploys the companyliveexperience React app
# to Firebase Hosting on PRs and pushes to the main branch.
# It also allows manual triggering with a specified channel ID.

name: Deploy to Firebase Hosting

# Define when this workflow should run
on:
  # Trigger on pull requests to the main branch (for preview channels)
  pull_request:
    branches:
      - main # Replace 'main' with your primary branch name if different

  # Trigger on pushes to the main branch (for live channel)
  push:
    branches:
      - main # Replace 'main' with your primary branch name if different

  # Allow manual triggering from the GitHub UI
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'The ID for the preview channel to deploy to (e.g., "my-feature-branch", "test-123"). Required for channel deployments via manual trigger.'
        required: true # Make this input mandatory for manual runs
        type: string
      # You could add other inputs here, like a branch name to checkout if needed,
      # but for a typical build from the currently checked out commit, channel_id is key.

jobs:
  build_and_deploy:
    # Specify the runner environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from your repository
      # If you want to manually specify a branch to build from,
      # you might need to add a 'ref' parameter here using another input.
      # For now, it checks out the commit related to the trigger.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # Use the Node.js version your project requires

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the React application
      - name: Build Application
        run: npm run build

      # Step 5a: Deploy to a Preview Channel (triggered by PR or manual dispatch)
      # On PR trigger, the action automatically generates a channel ID.
      - name: Deploy to Firebase Hosting PR Channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
         repoToken: '${{secrets.GITHUB_TOKEN }}'
         firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPANYLIVE_C3879 }}'
         projectId: companylive-c3879
         public: dist
         expires: 7d # Example: channel expires after 7 days
         
      # Step 5b: Deploy to a Preview Channel (triggered by PR or manual dispatch)
      # On PR trigger, the action automatically generates a channel ID.
      - name: Deploy to Firebase Hosting PR Channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
         repoToken: '${{secrets.GITHUB_TOKEN }}'
         firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPANYLIVE_C3879 }}'
         projectId: companylive-c3879
         public: dist
         channelId: 7d # Example: channel expires after 7 days
         
      # Step 5c: Deploy to the Live Channel (triggered by push to main or manual trigger)
      - name: Deploy to Firebase Hosting Live Channel
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}' # Still needed for potential status checks
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPANYLIVE_C3879 }}'
          projectId: companylive-c3879
          public: dist
          channelId: live
          
