# This workflow automatically builds and deploys the React application to Firebase Hosting
# for PRs, pushes to staging, and pushes to main (production).
# Each environment uses separate Firebase projects and service accounts for security isolation.
name: Deploy to Firebase Hosting

# Define when this workflow should run
on:
  # Trigger on pull requests targeting the main branch (for PR preview channels)
  pull_request:
    branches:
      - main
  # Trigger on pushes to specific branches (for staging and production)
  push:
    branches:
      - main      # For production deployment
      - staging   # For staging deployment (adjust branch name if different)
  # Trigger on GitHub releases for production deployment
  release:
    types: [published]
  # Allow manual triggering from the GitHub UI for specific environments
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Select environment to deploy to:'
        required: true
        type: choice
        options:
          - pr       # Deploy to a PR-specific preview channel
          - staging  # Deploy to the staging Firebase project
          - prod     # Deploy to the production Firebase project
      pr_number:
        description: 'PR number (required for "pr" environment via manual trigger)'
        required: false
        type: number
      channel_id:
        description: 'Custom channel ID (optional, for manual PR deployments)'
        required: false
        type: string

# Global environment variables
env:
  NODE_VERSION: 'lts/*'              # Node.js version to use
  BUILD_COMMAND: 'npx vite build --mode'     # Build command for your React app
  BUILD_DIR: 'dist'                  # Output directory after build (adjust if using 'build' instead)
  
  # Firebase Project IDs for each environment
  PR_PROJECT_ID: 'companylive-pr-sydney'
  STAGING_PROJECT_ID: 'companylive-staging-sydney'
  PROD_PROJECT_ID: 'companylive-c3879'

jobs:
  # Job to determine which environment we're deploying to
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine.outputs.environment }}
      project_id: ${{ steps.determine.outputs.project_id }}
      channel_id: ${{ steps.determine.outputs.channel_id }}
      is_live_deploy: ${{ steps.determine.outputs.is_live_deploy }}
      vite_mode: ${{ steps.determine.outputs.vite_mode }}
    
    steps:
      - name: Determine deployment environment
        id: determine
        run: |
          # Logic for Pull Request builds
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "environment=pr" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.PR_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "channel_id=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "is_live_deploy=false" >> $GITHUB_OUTPUT
            echo "vite_mode=pr" >> $GITHUB_OUTPUT
          # Logic for Staging branch pushes
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.STAGING_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "channel_id=live" >> $GITHUB_OUTPUT
            echo "is_live_deploy=true" >> $GITHUB_OUTPUT
            echo "vite_mode=staging" >> $GITHUB_OUTPUT
          # Logic for Production (main branch) pushes
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.PROD_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "channel_id=live" >> $GITHUB_OUTPUT
            echo "is_live_deploy=true" >> $GITHUB_OUTPUT
            echo "vite_mode=production" >> $GITHUB_OUTPUT
          # Logic for GitHub Releases (production deployment)
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "project_id=${{ env.PROD_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "channel_id=live" >> $GITHUB_OUTPUT
            echo "is_live_deploy=true" >> $GITHUB_OUTPUT
            echo "vite_mode=production" >> $GITHUB_OUTPUT
          # Logic for Manual Trigger (workflow_dispatch)
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ github.event.inputs.target_environment }}" in
              "pr")
                if [[ -z "${{ github.event.inputs.pr_number }}" ]]; then
                  echo "::error::Error: 'pr_number' input is required for 'pr' environment via manual trigger."
                  exit 1
                fi
                echo "environment=pr" >> $GITHUB_OUTPUT
                echo "project_id=${{ env.PR_PROJECT_ID }}" >> $GITHUB_OUTPUT
                # Use custom channel_id if provided, otherwise use pr-{number}
                if [[ -n "${{ github.event.inputs.channel_id }}" ]]; then
                  echo "channel_id=${{ github.event.inputs.channel_id }}" >> $GITHUB_OUTPUT
                else
                  echo "channel_id=pr-${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
                fi
                echo "is_live_deploy=false" >> $GITHUB_OUTPUT
                echo "vite_mode=pr" >> $GITHUB_OUTPUT
                ;;
              "staging")
                echo "environment=staging" >> $GITHUB_OUTPUT
                echo "project_id=${{ env.STAGING_PROJECT_ID }}" >> $GITHUB_OUTPUT
                echo "channel_id=live" >> $GITHUB_OUTPUT
                echo "is_live_deploy=true" >> $GITHUB_OUTPUT
                echo "vite_mode=staging" >> $GITHUB_OUTPUT
                ;;
              "prod")
                echo "environment=production" >> $GITHUB_OUTPUT
                echo "project_id=${{ env.PROD_PROJECT_ID }}" >> $GITHUB_OUTPUT
                echo "channel_id=live" >> $GITHUB_OUTPUT
                echo "is_live_deploy=true" >> $GITHUB_OUTPUT
                echo "vite_mode=production" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "::error::Error: Invalid 'target_environment' input for manual trigger."
                exit 1
                ;;
            esac
          else
            echo "::error::Error: Unable to determine deployment environment."
            exit 1
          fi

  # Build job - shared by all environments
  build:
    needs: [determine-environment]
    runs-on: ubuntu-latest
    steps:
      - name: Show VITE mode parameter
        run: |
          echo "Vite Mode: ${{ needs.determine-environment.outputs.vite_mode }}"
          
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Create VITE .env file for staging environment
        if: needs.determine-environment.outputs.environment == 'staging'
        run: |
          echo "VITE_API_URL=https://australia-southeast1-companylive-staging-sydney.cloudfunctions.net/companyliveservices-2-staging" >> .env.staging
          echo "VITE_USE_DYNAMIC_AUTH=true" >> .env.staging
          echo "VITE_FIREBASE_API_KEY={{ secrets.FIREBASE_STAGING_API_KEY }}" >> .env.staging
          echo "VITE_FIREBASE_AUTH_DOMAIN=companylive-staging-sydney.firebaseapp.com" >> .env.staging
          echo "VITE_FIREBASE_STORAGE_BUCKET=companylive-staging-sydney.firebasestorage.app" >> .env.staging
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID={{ secrets.FIREBASE_STAGING_MEASUREMENT_ID }}" >> .env.staging
          echo "VITE_FIREBASE_APP_ID={{ secrets.FIREBASE_STAGING_APP_ID }}" >> .env.staging
          echo "VITE_FIREBASE_MEASUREMENT_ID={{ secrets.FIREBASE_STAGING_MEASUREMENT_ID }}" >> .env.staging

      - name: Create VITE .env file for production environment
        if: needs.determine-environment.outputs.environment == 'production'
        run: |
          echo "VITE_API_URL=https://australia-southeast1-companylive-c3879.cloudfunctions.net/companyliveservices-2" >> .env.production
          echo "VITE_USE_DYNAMIC_AUTH=true" >> .env.production
          echo "VITE_FIREBASE_API_KEY={{ secrets.FIREBASE_PROD_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=companylive-c3879.firebaseapp.com" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=companylive-c3879.firebasestorage.app" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID={{ secrets.FIREBASE_PROD_MEASUREMENT_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID={{ secrets.FIREBASE_PROD_APP_ID }}" >> .env.production
          echo "VITE_FIREBASE_MEASUREMENT_ID={{ secrets.FIREBASE_PROD_MEASUREMENT_ID }}" >> .env.production
  
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npx vite build --mode ${{ needs.determine-environment.outputs.vite_mode }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.BUILD_DIR }}
          retention-days: 1

  # PR deployments - no environment protection needed
  deploy-pr:
    if: needs.determine-environment.outputs.environment == 'pr'
    needs: [determine-environment, build]
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.BUILD_DIR }}
      
      - name: Deploy to Firebase Hosting (PR Preview)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: 'TODO'  # PR-specific service account
          projectId: ${{ needs.determine-environment.outputs.project_id }}
          channelId: ${{ needs.determine-environment.outputs.channel_id }}
          expires: 7d
          # target: ${{ env.BUILD_DIR }}
      
      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **PR Preview Deployed Successfully!**
              
              **Environment:** PR Preview
              **Project:** \`${{ needs.determine-environment.outputs.project_id }}\`
              **Channel:** \`${{ needs.determine-environment.outputs.channel_id }}\`
              **Preview URL:** ${{ steps.deploy.outputs.details_url }}
              
              This preview will expire in 7 days or when the PR is closed.`
            })
      
      - name: Show deployment output (PR)
        run: |
          echo "PR Deployment successful!"
          echo "Deployed to Firebase Project ID: ${{ needs.determine-environment.outputs.project_id }}"
          echo "Channel ID: ${{ needs.determine-environment.outputs.channel_id }}"
          echo "Preview URL: ${{ steps.deploy.outputs.details_url }}"

  # Staging deployments - with staging environment protection
  deploy-staging:
    if: needs.determine-environment.outputs.environment == 'staging'
    needs: [determine-environment, build]
    runs-on: ubuntu-latest
    environment: staging  # This enables environment protection rules in GitHub
    
    permissions:
      contents: write
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.BUILD_DIR }}
      
      - name: Deploy to Firebase Hosting (Staging)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPANYLIVE_STAGING }}'  # Staging-specific service account
          projectId: ${{ needs.determine-environment.outputs.project_id }}
          channelId: ${{ needs.determine-environment.outputs.channel_id }}
          # target: ${{ env.BUILD_DIR }}
      
      - name: Show deployment output (Staging)
        run: |
          echo "Staging Deployment successful!"
          echo "Deployed to Firebase Project ID: ${{ needs.determine-environment.outputs.project_id }}"
          echo "Channel ID: ${{ needs.determine-environment.outputs.channel_id }}"
          echo "Live URL: ${{ steps.deploy.outputs.details_url }}"
      
      - name: Create GitHub Release (Staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `staging-v${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Staging Release ${tag}`,
              body: `Automated staging deployment\n\n**Live URL:** ${{ steps.deploy.outputs.details_url }}`,
              draft: false,
              prerelease: true
            });

  # Production deployments - with production environment protection
  deploy-production:
    if: needs.determine-environment.outputs.environment == 'production'
    needs: [determine-environment, build]
    runs-on: ubuntu-latest
    environment: production  # This enables environment protection rules in GitHub
    
    permissions:
      contents: write
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.BUILD_DIR }}
      
      - name: Deploy to Firebase Hosting (Production)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPANYLIVE_C3879 }}'  # Production service account
          projectId: ${{ needs.determine-environment.outputs.project_id }}
          channelId: ${{ needs.determine-environment.outputs.channel_id }}
          # target: ${{ env.BUILD_DIR }}
      
      - name: Show deployment output (Production)
        run: |
          echo "Production Deployment successful!"
          echo "Deployed to Firebase Project ID: ${{ needs.determine-environment.outputs.project_id }}"
          echo "Channel ID: ${{ needs.determine-environment.outputs.channel_id }}"
          echo "Live URL: ${{ steps.deploy.outputs.details_url }}"
      
      - name: Create GitHub Release (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Production Release ${tag}`,
              body: `Automated production deployment\n\n**Live URL:** ${{ steps.deploy.outputs.details_url }}`,
              draft: false,
              prerelease: false
            });
